name: Compilar Calculadora PCR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python Estable (3.12)
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar librerías en la nube
      run: |
        pip install streamlit pandas pyinstaller

    - name: Crear el archivo EXE
      run: |
        cd /workspaces/Master-Mix-Calculadora-/calculador-mastermix
        pyinstaller --onefile --copy-metadata streamlit --add-data "app_web.py;." --add-data "calculos.py;." lanzador.py

    - name: Guardar el resultado
      uses: actions/upload-artifact@v4
      with:
        name: Calculadora_PCR_Windows
        path: /workspaces/Master-Mix-Calculadora-/calculador-mastermix/dist/lanzador.exe
